spring:
  application:
    name: card-demo-backend
  datasource:
    url: jdbc:h2:mem:carddemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 1MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${carddemo.security.csrf-cookie-secure}
        same-site: strict
springdoc:
  api-docs:
    path: /api-docs
carddemo:
  security:
    csrf-cookie-secure: true
  seed:
    enabled: false
