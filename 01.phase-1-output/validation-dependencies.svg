<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
  <title id="title">CardDemo user administration validation dependencies</title>
  <desc id="desc">Groups ordered validation rules by sign-on, admin option, add, update, and delete workflows. Arrows show ordered conditional dependencies.</desc>
  <style>text{font-family:Arial,sans-serif;font-size:14px;fill:#16212b}.title{font-size:22px;font-weight:bold}.group{fill:#f4f8fc;stroke:#5a7d9a;stroke-width:2}.node{fill:#fff;stroke:#324d63;stroke-width:1.5}.unknown{fill:#fff7df;stroke:#b17900;stroke-width:1.5}.edge{stroke:#324d63;stroke-width:1.5;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#324d63"/></marker></defs>
  <text x="25" y="32" class="title">Source-derived validation dependencies</text>
  <text x="25" y="55">Solid arrows mean the later rule is reached only when the earlier rule passes. Exact field sizes and allowed role values are unknown.</text>
  <rect x="25" y="85" width="365" height="165" rx="10" class="group"/><text x="40" y="110">Sign-on — COSGN00C:117-130</text>
  <rect x="45" y="128" width="145" height="45" rx="6" class="node"/><text x="55" y="155">VAL-001 User ID</text><rect x="220" y="128" width="145" height="45" rx="6" class="node"/><text x="230" y="155">VAL-002 Password</text><line x1="190" y1="150" x2="220" y2="150" class="edge"/>
  <rect x="25" y="275" width="365" height="130" rx="10" class="group"/><text x="40" y="300">Admin menu — COADM01C:117-134</text><rect x="45" y="320" width="320" height="50" rx="6" class="unknown"/><text x="55" y="342">VAL-003 option numeric, nonzero,</text><text x="55" y="360">within unknown configured count</text>
  <rect x="420" y="85" width="795" height="245" rx="10" class="group"/><text x="435" y="110">Add user — COUSR01C:117-160, 240-266</text>
  <g><rect x="440" y="130" width="125" height="45" rx="6" class="node"/><text x="450" y="157">004 First name</text><rect x="590" y="130" width="125" height="45" rx="6" class="node"/><text x="600" y="157">005 Last name</text><rect x="740" y="130" width="125" height="45" rx="6" class="node"/><text x="750" y="157">006 User ID</text><rect x="890" y="130" width="125" height="45" rx="6" class="node"/><text x="900" y="157">007 Password</text><rect x="1040" y="130" width="150" height="45" rx="6" class="unknown"/><text x="1050" y="157">008 User type</text><line x1="565" y1="152" x2="590" y2="152" class="edge"/><line x1="715" y1="152" x2="740" y2="152" class="edge"/><line x1="865" y1="152" x2="890" y2="152" class="edge"/><line x1="1015" y1="152" x2="1040" y2="152" class="edge"/><rect x="740" y="225" width="160" height="45" rx="6" class="node"/><text x="750" y="252">009 Unique ID</text><line x1="1115" y1="175" x2="820" y2="225" class="edge"/></g>
  <rect x="25" y="435" width="770" height="225" rx="10" class="group"/><text x="40" y="460">Update — COUSR02C:145-245</text><rect x="45" y="485" width="135" height="45" rx="6" class="node"/><text x="55" y="512">010 Lookup ID</text><rect x="210" y="485" width="125" height="45" rx="6" class="node"/><text x="220" y="512">011 Save: ID</text><rect x="360" y="485" width="125" height="45" rx="6" class="node"/><text x="370" y="512">first/last name</text><rect x="510" y="485" width="125" height="45" rx="6" class="node"/><text x="520" y="512">password</text><rect x="660" y="485" width="110" height="45" rx="6" class="unknown"/><text x="670" y="512">user type</text><rect x="360" y="575" width="175" height="45" rx="6" class="node"/><text x="370" y="602">012 at least one change</text><line x1="335" y1="507" x2="360" y2="507" class="edge"/><line x1="485" y1="507" x2="510" y2="507" class="edge"/><line x1="635" y1="507" x2="660" y2="507" class="edge"/><line x1="715" y1="530" x2="450" y2="575" class="edge"/>
  <rect x="830" y="435" width="385" height="145" rx="10" class="group"/><text x="845" y="460">Delete — COUSR03C:144-192</text><rect x="855" y="490" width="170" height="45" rx="6" class="node"/><text x="865" y="517">013 User ID required</text><rect x="1050" y="490" width="140" height="45" rx="6" class="node"/><text x="1060" y="517">lookup / PF5</text><line x1="1025" y1="512" x2="1050" y2="512" class="edge"/>
</svg>
