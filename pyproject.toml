[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "document-entity-agent"
version = "0.1.0"
description = "LangGraph agent that discovers entities and maps attributes from PDF documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.54,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "pymupdf>=1.24,<2.0",
  "pytesseract>=0.3.13,<1.0",
  "pillow>=10.4,<12.0",
  "typer>=0.12,<1.0",
  "rich>=13.8,<14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
extract-entities = "entity_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
